<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Placar de Vôlei{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'home' %}">Placar de Vôlei</a></h1>
    </header>
    <main>
        {% if messages %}
            <ul aria-live="polite">
                {% for message in messages %}<li>{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
